# Jonas: On 03/31/2026 built this to list out the OSV Scanner files and dependencies.
# Fixed: heredoc indentation, find grouping, redundant sections,
#        missing console output, empty-section guards.

name: OSV Scanner + Full Dependency Audit

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: '43 22 * * 6'

permissions:
  security-events: write
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Job 1: COMPLETE FILE INVENTORY
  # ─────────────────────────────────────────────
  inventory:
    name: "📋 File Inventory & Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - name: "⬇️ Checkout source code"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ─────────────────────────────────────────
      # SECTION A: ALL FILES IN REPOSITORY
      # ─────────────────────────────────────────
      - name: "📁 Section A: List every file in the repository"
        run: |
          set -euo pipefail
          REPORT="all_files.txt"

          echo "============================================================" > "$REPORT"
          echo "  COMPLETE REPOSITORY FILE LIST" >> "$REPORT"
          echo "  Repository: ${{ github.repository }}" >> "$REPORT"
          echo "  Branch:     ${{ github.ref_name }}" >> "$REPORT"
          echo "  Commit:     ${{ github.sha }}" >> "$REPORT"
          echo "  Generated:  $(date -u)" >> "$REPORT"
          echo "============================================================" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "────────────────────────────────────────" >> "$REPORT"
          echo "  ALL FILES (complete tree)" >> "$REPORT"
          echo "────────────────────────────────────────" >> "$REPORT"

          find . -not -path './.git/*' -type f | sort > /tmp/all_files_list.txt
          cat /tmp/all_files_list.txt >> "$REPORT"
          TOTAL_ALL=$(wc -l < /tmp/all_files_list.txt)

          echo "" >> "$REPORT"
          echo "  TOTAL FILES IN REPOSITORY: $TOTAL_ALL" >> "$REPORT"

          cat "$REPORT"
          echo ""
          echo "📁 Total files in repository: $TOTAL_ALL"

      - name: "📁 Section A — Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: 01-all-repository-files
          path: all_files.txt
          retention-days: 90

      # ─────────────────────────────────────────
      # SECTION B: SOURCE CODE FILES BY TYPE
      # ─────────────────────────────────────────
      - name: "📝 Section B: Source code files organized by type"
        run: |
          set -euo pipefail
          REPORT="source_files.txt"

          echo "============================================================" > "$REPORT"
          echo "  SOURCE CODE FILE INVENTORY" >> "$REPORT"
          echo "  Repository: ${{ github.repository }}" >> "$REPORT"
          echo "  Branch:     ${{ github.ref_name }}" >> "$REPORT"
          echo "  Commit:     ${{ github.sha }}" >> "$REPORT"
          echo "  Generated:  $(date -u)" >> "$REPORT"
          echo "============================================================" >> "$REPORT"
          echo "" >> "$REPORT"

          # ── Helper function ──
          scan_files() {
            local title="$1"; shift
            local description="$1"; shift
            local tmpfile="/tmp/scan_$$.txt"

            echo "────────────────────────────────────────" >> "$REPORT"
            echo "  $title" >> "$REPORT"
            if [ -n "$description" ]; then
              echo "  $description" >> "$REPORT"
            fi
            echo "────────────────────────────────────────" >> "$REPORT"

            local find_args=()
            local first=true
            for ext in "$@"; do
              if [ "$first" = true ]; then
                find_args+=( -name "$ext" )
                first=false
              else
                find_args+=( -o -name "$ext" )
              fi
            done

            find . -not -path './.git/*' -type f $ "${find_args[@]}" $ 2>/dev/null | sort > "$tmpfile"
            local count
            count=$(wc -l < "$tmpfile")

            if [ "$count" -eq 0 ]; then
              echo "  (no files found)" >> "$REPORT"
            else
              cat "$tmpfile" >> "$REPORT"
            fi
            echo "  Count: $count" >> "$REPORT"
            echo "" >> "$REPORT"

            LAST_COUNT=$count
          }

          scan_files "C SOURCE FILES (.c)" "" "*.c"
          C_COUNT=$LAST_COUNT

          scan_files "C++ SOURCE FILES (.cpp / .cc / .cxx)" "" "*.cpp" "*.cc" "*.cxx"
          CPP_COUNT=$LAST_COUNT

          scan_files "HEADER FILES (.h / .hpp)" "" "*.h" "*.hpp"
          H_COUNT=$LAST_COUNT

          scan_files "PYTHON FILES (.py)" "(Build scripts, bindings, tests)" "*.py"
          PY_COUNT=$LAST_COUNT

          scan_files "JAVA FILES (.java)" "(Java/Android bindings)" "*.java"
          JAVA_COUNT=$LAST_COUNT

          scan_files "JAVASCRIPT FILES (.js / .ts)" "(Node.js, frontend)" "*.js" "*.ts" "*.jsx" "*.tsx"
          JS_COUNT=$LAST_COUNT

          scan_files "GO FILES (.go)" "" "*.go"
          GO_COUNT=$LAST_COUNT

          scan_files "RUST FILES (.rs)" "" "*.rs"
          RS_COUNT=$LAST_COUNT

          scan_files "CUDA / GPU FILES (.cu / .cl / .cuh)" "(GPU-accelerated modules)" "*.cu" "*.cl" "*.cuh"
          GPU_COUNT=$LAST_COUNT

          scan_files "ASSEMBLY FILES (.s / .S / .asm)" "" "*.s" "*.S" "*.asm"
          ASM_COUNT=$LAST_COUNT

          scan_files "BUILD & CONFIG FILES" "(CMake, Makefiles, YAML, JSON)" \
            "CMakeLists.txt" "*.cmake" "Makefile" "*.mk" \
            "*.json" "*.yml" "*.yaml" "*.cfg" "*.conf" "*.ini" \
            "*.sln" "*.vcxproj"
          BUILD_COUNT=$LAST_COUNT

          TOTAL=$((C_COUNT + CPP_COUNT + H_COUNT + PY_COUNT + JAVA_COUNT + JS_COUNT + GO_COUNT + RS_COUNT + GPU_COUNT + ASM_COUNT))

          echo "============================================================" >> "$REPORT"
          echo "  SUMMARY" >> "$REPORT"
          echo "============================================================" >> "$REPORT"
          echo "  C Source Files:      $C_COUNT" >> "$REPORT"
          echo "  C++ Source Files:    $CPP_COUNT" >> "$REPORT"
          echo "  Header Files:        $H_COUNT" >> "$REPORT"
          echo "  Python Files:        $PY_COUNT" >> "$REPORT"
          echo "  Java Files:          $JAVA_COUNT" >> "$REPORT"
          echo "  JavaScript/TS Files: $JS_COUNT" >> "$REPORT"
          echo "  Go Files:            $GO_COUNT" >> "$REPORT"
          echo "  Rust Files:          $RS_COUNT" >> "$REPORT"
          echo "  CUDA/GPU Files:      $GPU_COUNT" >> "$REPORT"
          echo "  Assembly Files:      $ASM_COUNT" >> "$REPORT"
          echo "  Build/Config Files:  $BUILD_COUNT" >> "$REPORT"
          echo "  ──────────────────────────────" >> "$REPORT"
          echo "  TOTAL SOURCE FILES:  $TOTAL" >> "$REPORT"
          echo "============================================================" >> "$REPORT"

          cat "$REPORT"

      - name: "📝 Section B — Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: 02-source-code-files
          path: source_files.txt
          retention-days: 90

      # ─────────────────────────────────────────
      # SECTION C: DEPENDENCY IDENTIFICATION
      # ─────────────────────────────────────────
      - name: "🔗 Section C-1: Git submodules"
        run: |
          set -euo pipefail
          REPORT="dependencies.txt"

          echo "============================================================" > "$REPORT"
          echo "  DEPENDENCY IDENTIFICATION REPORT" >> "$REPORT"
          echo "  Repository: ${{ github.repository }}" >> "$REPORT"
          echo "  Branch:     ${{ github.ref_name }}" >> "$REPORT"
          echo "  Commit:     ${{ github.sha }}" >> "$REPORT"
          echo "  Generated:  $(date -u)" >> "$REPORT"
          echo "============================================================" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "────────────────────────────────────────" >> "$REPORT"
          echo "  1. GIT SUBMODULES" >> "$REPORT"
          echo "     (External repos pulled into this project)" >> "$REPORT"
          echo "────────────────────────────────────────" >> "$REPORT"

          if [ -f ".gitmodules" ]; then
            echo "  .gitmodules found:" >> "$REPORT"
            echo "" >> "$REPORT"
            cat .gitmodules >> "$REPORT"
            echo "" >> "$REPORT"
            echo "  Submodule status:" >> "$REPORT"
            git submodule status >> "$REPORT" 2>/dev/null || echo "  (unable to get status)" >> "$REPORT"
          else
            echo "  ⚠️  No .gitmodules file found — no submodules in this repo" >> "$REPORT"
          fi
          echo "" >> "$REPORT"

          cat "$REPORT"

      - name: "🔗 Section C-2: Project modules, vendor dirs, and bundled libraries"
        run: |
          set -euo pipefail
          REPORT="dependencies.txt"

          echo "────────────────────────────────────────" >> "$REPORT"
          echo "  2. PROJECT MODULES & BUNDLED LIBRARIES" >> "$REPORT"
          echo "────────────────────────────────────────" >> "$REPORT"
          echo "" >> "$REPORT"

          # ── OpenCV Core Modules ──
          echo "  --- Core Modules ---" >> "$REPORT"
          CORE_MODULES=("core" "imgproc" "imgcodecs" "videoio" "highgui" \
                        "video" "calib3d" "features2d" "objdetect" \
                        "dnn" "ml" "flann" "photo" "stitching" "gapi")
          CORE_FOUND=0
          for mod in "${CORE_MODULES[@]}"; do
            MOD_PATH=$(find . -not -path './.git/*' -type d -name "$mod" -path "*/modules/*" -print -quit 2>/dev/null || true)
            if [ -z "$MOD_PATH" ]; then
              MOD_PATH=$(find . -not -path './.git/*' -type d -name "$mod" -print -quit 2>/dev/null || true)
            fi
            if [ -n "$MOD_PATH" ]; then
              echo "  ✅ opencv_$mod: $MOD_PATH" >> "$REPORT"
              CORE_FOUND=$((CORE_FOUND + 1))
            fi
          done
          if [ "$CORE_FOUND" -eq 0 ]; then
            echo "  ⚠️  No OpenCV core modules found" >> "$REPORT"
            echo "     (This section is designed for OpenCV repos — may not apply)" >> "$REPORT"
          fi
          echo "" >> "$REPORT"

          # ── OpenCV Contrib Modules ──
          echo "  --- Contrib / Extra Modules ---" >> "$REPORT"
          CONTRIB_MODULES=("aruco" "bgsegm" "bioinspired" "ccalib" \
                           "cudaarithm" "cudabgsegm" "cudacodec" "cudafeatures2d" \
                           "cudafilters" "cudaimgproc" "cudalegacy" "cudaobjdetect" \
                           "cudaoptflow" "cudastereo" "cudawarping" "cudev" \
                           "datasets" "dnn_objdetect" "dnn_superres" "dpm" \
                           "face" "freetype" "fuzzy" "hdf" "hfs" \
                           "img_hash" "line_descriptor" "mcc" "optflow" \
                           "phase_unwrapping" "plot" "quality" "rapid" \
                           "reg" "rgbd" "saliency" "sfm" "shape" \
                           "stereo" "structured_light" "superres" \
                           "surface_matching" "text" "tracking" \
                           "videostab" "viz" "wechat_qrcode" "xfeatures2d" \
                           "ximgproc" "xobjdetect" "xphoto")
          CONTRIB_FOUND=0
          for mod in "${CONTRIB_MODULES[@]}"; do
            MOD_PATH=$(find . -not -path './.git/*' -type d -name "$mod" -print -quit 2>/dev/null || true)
            if [ -n "$MOD_PATH" ]; then
              echo "  ✅ opencv_$mod: $MOD_PATH" >> "$REPORT"
              CONTRIB_FOUND=$((CONTRIB_FOUND + 1))
            fi
          done
          if [ "$CONTRIB_FOUND" -eq 0 ]; then
            echo "  ⚠️  No contrib modules found" >> "$REPORT"
          fi
          echo "" >> "$REPORT"

          # ── Version Detection ──
          echo "  --- Version Detection ---" >> "$REPORT"
          VERSION_FILE=$(find . -not -path './.git/*' -name "version.hpp" -path "*/opencv2/*" -print -quit 2>/dev/null || true)
          if [ -n "$VERSION_FILE" ]; then
            echo "  Version file: $VERSION_FILE" >> "$REPORT"
            grep -E "CV_VERSION_" "$VERSION_FILE" | head -5 >> "$REPORT" || true
          else
            VERSION_CMAKE=$(find . -not -path './.git/*' -name "OpenCVConfig-version.cmake" -print -quit 2>/dev/null || true)
            if [ -n "$VERSION_CMAKE" ]; then
              echo "  Version file: $VERSION_CMAKE" >> "$REPORT"
              grep -E "OpenCV_VERSION" "$VERSION_CMAKE" | head -3 >> "$REPORT" || true
            else
              echo "  ⚠️  No version file found" >> "$REPORT"
            fi
          fi
          echo "" >> "$REPORT"

          # ── Vendor / Third-Party Directories ──
          echo "────────────────────────────────────────" >> "$REPORT"
          echo "  2b. VENDOR / THIRD-PARTY DIRECTORIES" >> "$REPORT"
          echo "      (External code bundled in this repository)" >> "$REPORT"
          echo "────────────────────────────────────────" >> "$REPORT"

          VENDOR_DIRS=("3rdparty" "vendor" "third_party" "third-party" \
                       "thirdparty" "external" "extern" "deps" "contrib")
          VENDOR_FOUND=0
          for dir in "${VENDOR_DIRS[@]}"; do
            FOUND=$(find . -not -path './.git/*' -maxdepth 2 -type d -iname "$dir" 2>/dev/null || true)
            if [ -n "$FOUND" ]; then
              echo "$FOUND" | while read -r d; do
                echo "  ✅ $d/" >> "$REPORT"
                ls -1 "$d" 2>/dev/null | sed 's/^/       /' >> "$REPORT"
                echo "" >> "$REPORT"
              done
              VENDOR_FOUND=$((VENDOR_FOUND + 1))
            fi
          done
          if [ "$VENDOR_FOUND" -eq 0 ]; then
            echo "  ⚠️  No vendor/third-party directories found" >> "$REPORT"
          fi
          echo "" >> "$REPORT"

          # ── Known External Libraries ──
          echo "────────────────────────────────────────" >> "$REPORT"
          echo "  2c. KNOWN EXTERNAL LIBRARIES DETECTED" >> "$REPORT"
          echo "      (Common libraries this project may depend on)" >> "$REPORT"
          echo "────────────────────────────────────────" >> "$REPORT"

          KNOWN_LIBS=(
            "zlib:Compression Library"
            "libjpeg:JPEG Image Codec"
            "libpng:PNG Image Codec"
            "libtiff:TIFF Image Codec"
            "libwebp:WebP Image Codec"
            "openjpeg:JPEG 2000 Codec"
            "openexr:HDR Image Format"
            "jasper:JPEG 2000 Library"
            "protobuf:Protocol Buffers (DNN)"
            "eigen:Linear Algebra Library"
            "lapack:Linear Algebra Package"
            "openblas:BLAS Library"
            "tbb:Intel Threading Building Blocks"
            "ipp:Intel Performance Primitives"
            "ffmpeg:Video Codec Library"
            "gstreamer:Multimedia Framework"
            "gtk:GUI Toolkit"
            "qt:Qt GUI Framework"
            "tesseract:OCR Engine"
            "onnx:ONNX Runtime (DNN)"
            "flatbuffers:Serialization Library"
            "quirc:QR Code Decoder"
            "ade:Graph Framework"
          )
          LIB_FOUND=0
          for entry in "${KNOWN_LIBS[@]}"; do
            LIB_NAME="${entry%%:*}"
            LIB_DESC="${entry##*:}"
            LIB_PATH=$(find . -not -path './.git/*' -type d -iname "$LIB_NAME" -print -quit 2>/dev/null || true)
            if [ -n "$LIB_PATH" ]; then
              echo "  ✅ $LIB_NAME ($LIB_DESC): $LIB_PATH" >> "$REPORT"
              LIB_FOUND=$((LIB_FOUND + 1))
            fi
          done
          if [ "$LIB_FOUND" -eq 0 ]; then
            echo "  ⚠️  No known external libraries detected in the source tree" >> "$REPORT"
          fi
          echo "" >> "$REPORT"

          cat "$REPORT"

      - name: "🔗 Section C-3: #include analysis with source file mapping"
        run: |
          set -euo pipefail
          REPORT="dependencies.txt"

          echo "────────────────────────────────────────" >> "$REPORT"
          echo "  3. C/C++ #include ANALYSIS" >> "$REPORT"
          echo "     (What libraries your code references)" >> "$REPORT"
          echo "────────────────────────────────────────" >> "$REPORT"
          echo "" >> "$REPORT"

          # Check if there are any C/C++ files
          CPP_FILE_COUNT=$(find . -not -path './.git/*' -type f \
            $ -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.cc" $ | wc -l)

          if [ "$CPP_FILE_COUNT" -eq 0 ]; then
            echo "  ⚠️  No C/C++ source files found in this repository." >> "$REPORT"
            echo "     Skipping #include analysis." >> "$REPORT"
            echo "" >> "$REPORT"
            echo "0" > /tmp/sys_include_count.txt
            echo "0" > /tmp/local_include_count.txt
          else
            echo "  Found $CPP_FILE_COUNT C/C++ files to scan" >> "$REPORT"
            echo "" >> "$REPORT"

            # ── Unique system includes ──
            echo "  --- Unique System Includes <...> ---" >> "$REPORT"
            echo "  (External/system libraries)" >> "$REPORT"
            grep -rh "^#include\s*<" --include="*.c" --include="*.cpp" \
              --include="*.h" --include="*.hpp" --include="*.cc" . 2>/dev/null | \
              sed 's/^[[:space:]]*//' | sort -u > /tmp/sys_includes.txt || true
            SYS_COUNT=$(wc -l < /tmp/sys_includes.txt)

            if [ "$SYS_COUNT" -eq 0 ]; then
              echo "  (none found)" >> "$REPORT"
            else
              cat /tmp/sys_includes.txt >> "$REPORT"
            fi
            echo "  Count: $SYS_COUNT unique system includes" >> "$REPORT"
            echo "" >> "$REPORT"

            # ── Unique local includes ──
            echo "  --- Unique Project Includes "..." ---" >> "$REPORT"
            echo "  (Files within this project)" >> "$REPORT"
            grep -rh '^#include\s*"' --include="*.c" --include="*.cpp" \
              --include="*.h" --include="*.hpp" --include="*.cc" . 2>/dev/null | \
              sed 's/^[[:space:]]*//' | sort -u > /tmp/local_includes.txt || true
            LOCAL_COUNT=$(wc -l < /tmp/local_includes.txt)

            if [ "$LOCAL_COUNT" -eq 0 ]; then
              echo "  (none found)" >> "$REPORT"
            else
              cat /tmp/local_includes.txt >> "$REPORT"
            fi
            echo "  Count: $LOCAL_COUNT unique local includes" >> "$REPORT"
            echo "" >> "$REPORT"

            # ── Full mapping (file:line:#include) ──
            echo "  --- Include Map (file:line:#include) ---" >> "$REPORT"
            echo "  (First 500 entries shown)" >> "$REPORT"
            grep -rn "^#include" --include="*.c" --include="*.cpp" \
              --include="*.h" --include="*.hpp" --include="*.cc" . 2>/dev/null | \
              sort | head -500 >> "$REPORT" || true
            TOTAL_INCLUDES=$(grep -rn "^#include" --include="*.c" --include="*.cpp" \
              --include="*.h" --include="*.hpp" --include="*.cc" . 2>/dev/null | wc -l || true)
            echo "" >> "$REPORT"
            echo "  Total include statements: ${TOTAL_INCLUDES:-0}" >> "$REPORT"
            echo "" >> "$REPORT"

            # Save counts for summary
            echo "$SYS_COUNT" > /tmp/sys_include_count.txt
            echo "$LOCAL_COUNT" > /tmp/local_include_count.txt
          fi

          cat "$REPORT"

      - name: "🔗 Section C-4: Build system and package manager dependencies"
        run: |
          set -euo pipefail
          REPORT="dependencies.txt"

          echo "────────────────────────────────────────" >> "$REPORT"
          echo "  4. BUILD SYSTEM DEPENDENCIES" >> "$REPORT"
          echo "     (CMake + package manager files)" >> "$REPORT"
          echo "────────────────────────────────────────" >> "$REPORT"
          echo "" >> "$REPORT"

          # ── Helper function for CMake grep ──
          cmake_grep() {
            local label="$1"
            local pattern="$2"
            echo "  $label:" >> "$REPORT"
            local results
            results=$(grep -rn "$pattern" --include="CMakeLists.txt" --include="*.cmake" . 2>/dev/null | sort || true)
            if [ -z "$results" ]; then
              echo "    (none found)" >> "$REPORT"
            else
              echo "$results" | sed 's/^/    /' >> "$REPORT"
            fi
            echo "" >> "$REPORT"
          }

          # ── CMake Analysis ──
          CMAKE_COUNT=$(find . -not -path './.git/*' -type f \
            $ -name "CMakeLists.txt" -o -name "*.cmake" $ | wc -l)

          if [ "$CMAKE_COUNT" -eq 0 ]; then
            echo "  ⚠️  No CMake files found. Skipping CMake analysis." >> "$REPORT"
            echo "" >> "$REPORT"
          else
            echo "  Found $CMAKE_COUNT CMake files" >> "$REPORT"
            echo "" >> "$REPORT"
            cmake_grep "find_package() — System libraries required" "find_package"
            cmake_grep "FetchContent_Declare() — Downloaded during build" "FetchContent_Declare"
            cmake_grep "ExternalProject_Add() — External projects" "ExternalProject_Add"
            cmake_grep "add_subdirectory() — Subdirs in build" "add_subdirectory"
            cmake_grep "target_link_libraries() — Linked libraries" "target_link_libraries"
          fi

          # ── Package Manager Files ──
          echo "────────────────────────────────────────" >> "$REPORT"
          echo "  4b. PACKAGE MANAGER FILES" >> "$REPORT"
          echo "      (Dependency manifests)" >> "$REPORT"
          echo "────────────────────────────────────────" >> "$REPORT"

          MANIFESTS=("vcpkg.json" "conanfile.txt" "conanfile.py" \
                     "package.json" "package-lock.json" \
                     "requirements.txt" "setup.py" "setup.cfg" \
                     "pyproject.toml" "Pipfile" "Pipfile.lock" \
                     "Cargo.toml" "Cargo.lock" \
                     "go.mod" "go.sum" \
                     "build.gradle" "pom.xml" \
                     "Gemfile" "Gemfile.lock" \
                     "composer.json" \
                     "manifest.yml" "sbom.json")
          MANIFEST_FOUND=0
          for manifest in "${MANIFESTS[@]}"; do
            FOUND=$(find . -not -path './.git/*' -not -path '*/node_modules/*' \
              -name "$manifest" -type f 2>/dev/null || true)
            if [ -n "$FOUND" ]; then
              MANIFEST_FOUND=$((MANIFEST_FOUND + 1))
              echo "$FOUND" | while read -r f; do
                echo "  ✅ $f" >> "$REPORT"
                echo "     Contents (first 30 lines):" >> "$REPORT"
                head -30 "$f" | sed 's/^/       /' >> "$REPORT"
                echo "" >> "$REPORT"
              done
            fi
          done
          if [ "$MANIFEST_FOUND" -eq 0 ]; then
            echo "  ⚠️  No package manager files found" >> "$REPORT"
          fi
          echo "" >> "$REPORT"

          cat "$REPORT"

      - name: "🔗 Section C-5: Language-specific dependencies"
        run: |
          set -euo pipefail
          REPORT="dependencies.txt"

          echo "────────────────────────────────────────" >> "$REPORT"
          echo "  5. LANGUAGE-SPECIFIC DEPENDENCIES" >> "$REPORT"
          echo "────────────────────────────────────────" >> "$REPORT"
          echo "" >> "$REPORT"

          # ── Python ──
          echo "  --- Python ---" >> "$REPORT"
          PY_COUNT=$(find . -not -path './.git/*' -type f -name "*.py" | wc -l)
          PY_IMPORT_COUNT=0

          if [ "$PY_COUNT" -eq 0 ]; then
            echo "  ⚠️  No Python files found. Skipping." >> "$REPORT"
          else
            echo "  Found $PY_COUNT Python files" >> "$REPORT"
            echo "" >> "$REPORT"
            echo "  Unique import statements:" >> "$REPORT"
            grep -rh "^import \|^from " --include="*.py" . 2>/dev/null | \
              sed 's/^[[:space:]]*//' | sort -u > /tmp/py_imports.txt || true
            PY_IMPORT_COUNT=$(wc -l < /tmp/py_imports.txt)

            if [ "$PY_IMPORT_COUNT" -eq 0 ]; then
              echo "    (no imports found)" >> "$REPORT"
            else
              cat /tmp/py_imports.txt | sed 's/^/    /' >> "$REPORT"
            fi
            echo "  Count: $PY_IMPORT_COUNT unique Python imports" >> "$REPORT"

            # Show requirements files
            echo "" >> "$REPORT"
            echo "  Requirements files:" >> "$REPORT"
            REQ_FOUND=$(find . -not -path './.git/*' -name "requirements*.txt" -type f 2>/dev/null || true)
            if [ -n "$REQ_FOUND" ]; then
              echo "$REQ_FOUND" | while read -r f; do
                echo "  ✅ $f:" >> "$REPORT"
                cat "$f" | sed 's/^/       /' >> "$REPORT"
                echo "" >> "$REPORT"
              done
            else
              echo "    (no requirements files found)" >> "$REPORT"
            fi
          fi
          echo "" >> "$REPORT"

          # ── JavaScript / Node.js ──
          echo "  --- JavaScript / Node.js ---" >> "$REPORT"
          if [ -f "package.json" ]; then
            echo "  package.json found" >> "$REPORT"
            echo "" >> "$REPORT"
            echo "  dependencies:" >> "$REPORT"
            DEPS=$(grep -A 100 '"dependencies"' package.json 2>/dev/null | \
              grep -E '^\s*"' | head -30 || true)
            if [ -n "$DEPS" ]; then
              echo "$DEPS" | sed 's/^/    /' >> "$REPORT"
            else
              echo "    (none)" >> "$REPORT"
            fi
            echo "" >> "$REPORT"
            echo "  devDependencies:" >> "$REPORT"
            DEV_DEPS=$(grep -A 100 '"devDependencies"' package.json 2>/dev/null | \
              grep -E '^\s*"' | head -30 || true)
            if [ -n "$DEV_DEPS" ]; then
              echo "$DEV_DEPS" | sed 's/^/    /' >> "$REPORT"
            else
              echo "    (none)" >> "$REPORT"
            fi
          else
            JS_COUNT=$(find . -not -path './.git/*' -not -path '*/node_modules/*' \
              -type f -name "*.js" | wc -l)
            if [ "$JS_COUNT" -gt 0 ]; then
              echo "  Found $JS_COUNT .js files but no package.json" >> "$REPORT"
            else
              echo "  ⚠️  No JavaScript/Node.js project detected. Skipping." >> "$REPORT"
            fi
          fi
          echo "" >> "$REPORT"

          # ── Go ──
          echo "  --- Go ---" >> "$REPORT"
          if [ -f "go.mod" ]; then
            echo "  go.mod contents:" >> "$REPORT"
            cat go.mod | sed 's/^/    /' >> "$REPORT"
          else
            GO_COUNT=$(find . -not -path './.git/*' -type f -name "*.go" | wc -l)
            if [ "$GO_COUNT" -gt 0 ]; then
              echo "  Found $GO_COUNT .go files but no go.mod" >> "$REPORT"
            else
              echo "  ⚠️  No Go project detected. Skipping." >> "$REPORT"
            fi
          fi
          echo "" >> "$REPORT"

          # ── Rust ──
          echo "  --- Rust ---" >> "$REPORT"
          if [ -f "Cargo.toml" ]; then
            echo "  Cargo.toml dependencies:" >> "$REPORT"
            CARGO_DEPS=$(grep -A 50 '^$$dependencies$$' Cargo.toml 2>/dev/null | head -30 || true)
            if [ -n "$CARGO_DEPS" ]; then
              echo "$CARGO_DEPS" | sed 's/^/    /' >> "$REPORT"
            else
              echo "    (no dependencies section found)" >> "$REPORT"
            fi
          else
            RS_COUNT=$(find . -not -path './.git/*' -type f -name "*.rs" | wc -l)
            if [ "$RS_COUNT" -gt 0 ]; then
              echo "  Found $RS_COUNT .rs files but no Cargo.toml" >> "$REPORT"
            else
              echo "  ⚠️  No Rust project detected. Skipping." >> "$REPORT"
            fi
          fi
          echo "" >> "$REPORT"

          # ── Ruby ──
          echo "  --- Ruby ---" >> "$REPORT"
          if [ -f "Gemfile" ]; then
            echo "  Gemfile contents:" >> "$REPORT"
            head -30 Gemfile | sed 's/^/    /' >> "$REPORT"
          else
            echo "  ⚠️  No Ruby project detected. Skipping." >> "$REPORT"
          fi
          echo "" >> "$REPORT"

          # ── DEPENDENCY SUMMARY ──
          SYS_COUNT=$(cat /tmp/sys_include_count.txt 2>/dev/null || echo 0)
          LOCAL_COUNT=$(cat /tmp/local_include_count.txt 2>/dev/null || echo 0)
          SUBMOD_COUNT=$(git submodule status 2>/dev/null | wc -l || echo 0)

          echo "============================================================" >> "$REPORT"
          echo "  DEPENDENCY SUMMARY" >> "$REPORT"
          echo "============================================================" >> "$REPORT"
          echo "  Unique C/C++ system includes:  $SYS_COUNT" >> "$REPORT"
          echo "  Unique C/C++ local includes:   $LOCAL_COUNT" >> "$REPORT"
          echo "  Unique Python imports:          $PY_IMPORT_COUNT" >> "$REPORT"
          echo "  Git submodules:                $SUBMOD_COUNT" >> "$REPORT"
          echo "============================================================" >> "$REPORT"

          cat "$REPORT"

      - name: "🔗 Section C — Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: 03-dependency-report
          path: dependencies.txt
          retention-days: 90

      # ─────────────────────────────────────────
      # SECTION D: COMBINED SUMMARY REPORT
      # ─────────────────────────────────────────
      - name: "📊 Section D: Summary dashboard"
        run: |
          set -euo pipefail
          REPORT="summary_report.txt"

          echo "============================================================" > "$REPORT"
          echo "  SECURITY AUDIT SUMMARY REPORT" >> "$REPORT"
          echo "  Repository: ${{ github.repository }}" >> "$REPORT"
          echo "  Branch:     ${{ github.ref_name }}" >> "$REPORT"
          echo "  Commit:     ${{ github.sha }}" >> "$REPORT"
          echo "  Generated:  $(date -u)" >> "$REPORT"
          echo "  Run ID:     ${{ github.run_id }}" >> "$REPORT"
          echo "============================================================" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "  REPOSITORY STATISTICS" >> "$REPORT"
          echo "  ─────────────────────" >> "$REPORT"
          echo "  Total files:         $(find . -not -path './.git/*' -type f | wc -l)" >> "$REPORT"
          echo "  Total directories:   $(find . -not -path './.git/*' -type d | wc -l)" >> "$REPORT"
          echo "  C files (.c):        $(find . -not -path './.git/*' -type f -name '*.c' | wc -l)" >> "$REPORT"
          echo "  C++ files:           $(find . -not -path './.git/*' -type f $ -name '*.cpp' -o -name '*.cc' $ | wc -l)" >> "$REPORT"
          echo "  Headers (.h/.hpp):   $(find . -not -path './.git/*' -type f $ -name '*.h' -o -name '*.hpp' $ | wc -l)" >> "$REPORT"
          echo "  Python files (.py):  $(find . -not -path './.git/*' -type f -name '*.py' | wc -l)" >> "$REPORT"
          echo "  Java files (.java):  $(find . -not -path './.git/*' -type f -name '*.java' | wc -l)" >> "$REPORT"
          echo "  JavaScript files:    $(find . -not -path './.git/*' -not -path '*/node_modules/*' -type f $ -name '*.js' -o -name '*.ts' $ | wc -l)" >> "$REPORT"
          echo "  Go files (.go):      $(find . -not -path './.git/*' -type f -name '*.go' | wc -l)" >> "$REPORT"
          echo "  Rust files (.rs):    $(find . -not -path './.git/*' -type f -name '*.rs' | wc -l)" >> "$REPORT"
          echo "  CUDA/GPU files:      $(find . -not -path './.git/*' -type f $ -name '*.cu' -o -name '*.cl' $ | wc -l)" >> "$REPORT"
          echo "  Assembly files:      $(find . -not -path './.git/*' -type f $ -name '*.s' -o -name '*.S' -o -name '*.asm' $ | wc -l)" >> "$REPORT"
          echo "  CMake files:         $(find . -not -path './.git/*' -type f $ -name 'CMakeLists.txt' -o -name '*.cmake' $ | wc -l)" >> "$REPORT"
          echo "  Git submodules:      $(git submodule status 2>/dev/null | wc -l || echo 0)" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "  ARTIFACTS GENERATED" >> "$REPORT"
          echo "  ─────────────────────" >> "$REPORT"
          echo "  01-all-repository-files   — Every file in the repo" >> "$REPORT"
          echo "  02-source-code-files      — Source code organized by type" >> "$REPORT"
          echo "  03-dependency-report      — All dependencies identified" >> "$REPORT"
          echo "  04-summary-report         — This summary" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "  NEXT STEP" >> "$REPORT"
          echo "  ─────────────────────" >> "$REPORT"
          echo "  OSV vulnerability scan runs after this job completes." >> "$REPORT"
          echo "  Check the Security tab for vulnerability results." >> "$REPORT"
          echo "============================================================" >> "$REPORT"

          cat "$REPORT"

      - name: "📊 Section D — Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: 04-summary-report
          path: summary_report.txt
          retention-days: 90

  # ─────────────────────────────────────────────
  # Job 2: OSV Vulnerability Scan
  # ─────────────────────────────────────────────
  scan-osv:
    name: "🛡️ OSV Vulnerability Scanner"
    needs: inventory
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@1f1242919d8a60496dd1874b24b62b2370ed4c78
    with:
      scan-args: |
        -r
        --skip-git
        ./
        
