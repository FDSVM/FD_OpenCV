name: OSV Scanner + Files + Dependencies

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '43 22 * * 6'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------- FILE LIST --------
      - name: Generate source file list
        run: |
          echo "C/C++/Header files:" > scanned_files.txt

          find . -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) \
            -not -path "./.git/*" \
            -not -path "./build/*" \
            -not -path "./out/*" >> scanned_files.txt

          echo "" >> scanned_files.txt

          FILE_COUNT=$(find . -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) \
            -not -path "./.git/*" \
            -not -path "./build/*" \
            -not -path "./out/*" | wc -l)

          echo "Total files: $FILE_COUNT" >> scanned_files.txt

      - name: Print scanned files
        run: |
          echo "===== FILES SCANNED ====="
          cat scanned_files.txt

      - name: Upload file list
        uses: actions/upload-artifact@v4
        with:
          name: scanned-files
          path: scanned_files.txt

      # -------- DEPENDENCY LIST --------
      - name: Extract dependency indicators
        run: |
          echo "Dependency Indicators:" > dependencies.txt
          echo "" >> dependencies.txt

          echo "---- CMake ----" >> dependencies.txt
          grep -r "find_package" . \
            --exclude-dir=.git --exclude-dir=build --exclude-dir=out >> dependencies.txt || true

          echo "" >> dependencies.txt
          echo "---- Include Statements ----" >> dependencies.txt
          grep -r "^#include" . \
            --include=\*.c --include=\*.cpp --include=\*.h \
            --exclude-dir=.git --exclude-dir=build --exclude-dir=out >> dependencies.txt || true

          echo "" >> dependencies.txt
          echo "---- Package Manifests ----" >> dependencies.txt
          find . -name "vcpkg.json" -not -path "./.git/*" >> dependencies.txt || true
          find . -name "conanfile.*" -not -path "./.git/*" >> dependencies.txt || true

      - name: Print dependencies
        run: |
          echo "===== DEPENDENCIES ====="
          cat dependencies.txt

      - name: Upload dependency list
        uses: actions/upload-artifact@v4
        with:
          name: detected-dependencies
          path: dependencies.txt

  scan-osv:
    needs: inventory
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v1
    with:
      scan-args: |
        -r
        --skip-git
        ./
