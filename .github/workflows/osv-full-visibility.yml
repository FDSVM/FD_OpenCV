name: OSV Scanner + Files + Dependencies

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '43 22 * * 6' # weekly on Saturday 22:43 UTC

permissions:
  security-events: write
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # -------- FILE LIST --------
      - name: Generate source file list
        run: |
          echo "C/C++/Header files:" > scanned_files.txt
          find . -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) >> scanned_files.txt
          echo "" >> scanned_files.txt
          echo "Total files: $(wc -l < scanned_files.txt)" >> scanned_files.txt

      - name: Upload file list artifact
        uses: actions/upload-artifact@v4
        with:
          name: scanned-files
          path: scanned_files.txt

      # -------- DEPENDENCY LIST --------
      - name: Extract precise dependencies
        run: |
          echo "Dependency Indicators:" > dependencies.txt
          echo "" >> dependencies.txt

          echo "---- CMake find_package ----" >> dependencies.txt
          grep -r "find_package" . || echo "None found" >> dependencies.txt

          echo "" >> dependencies.txt
          echo "---- vcpkg.json Dependencies ----" >> dependencies.txt
          for f in $(find . -name "vcpkg.json"); do
            echo "File: $f" >> dependencies.txt
            jq -r '.dependencies[]?' "$f" >> dependencies.txt
          done || echo "None found" >> dependencies.txt

          echo "" >> dependencies.txt
          echo "---- Conan Dependencies ----" >> dependencies.txt
          for f in $(find . -name "conanfile.txt" -o -name "conanfile.py"); do
            echo "File: $f" >> dependencies.txt
            if [[ "$f" == *.txt ]]; then
              grep "^\s*\[requires\]" -A 10 "$f" >> dependencies.txt
            else
              echo "Python-style conanfile detected, parse manually" >> dependencies.txt
            fi
          done || echo "None found" >> dependencies.txt

          echo "" >> dependencies.txt
          echo "---- Include Statements ----" >> dependencies.txt
          grep -r '^#include' . | sort | uniq >> dependencies.txt || echo "None found" >> dependencies.txt

          echo "" >> dependencies.txt
          echo "---- Summary ----" >> dependencies.txt
          echo "Total source files: $(find . -type f \( -name '*.c' -o -name '*.cpp' -o -name '*.h' \) | wc -l)" >> dependencies.txt
          echo "Total includes: $(grep -r '^#include' . | wc -l)" >> dependencies.txt

      - name: Upload dependency list artifact
        uses: actions/upload-artifact@v4
        with:
          name: detected-dependencies
          path: dependencies.txt

  scan-osv:
    needs: inventory
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@1f1242919d8a60496dd1874b24b62b2370ed4c78
    with:
      scan-args: |
        -r
        --skip-git
        ./
