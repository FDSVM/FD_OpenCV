name: Full Dependency Audit + OSV Scanner

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: '43 22 * * 6' # Weekly on Saturday 22:43 UTC

permissions:
  security-events: write
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # -------- SOURCE FILE LIST --------
      - name: Generate source file list
        run: |
          echo "C/C++/Header files:" > scanned_files.txt
          find . -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) >> scanned_files.txt
          echo "" >> scanned_files.txt
          echo "Total files: $(wc -l < scanned_files.txt)" >> scanned_files.txt

      - name: Upload source file list
        uses: actions/upload-artifact@v4
        with:
          name: scanned-files
          path: scanned_files.txt

      # -------- DEPENDENCY SBOM --------
      - name: Install CycloneDX Python tool
        run: python3 -m pip install --upgrade pip cyclonedx-bom --quiet

      - name: Generate SBOM
        run: |
          echo "Generating CycloneDX SBOM..."
          cyclonedx-py -o sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Generate human-readable dependency summary
        run: |
          echo "Dependencies in SBOM:" > dependencies.txt
          jq -r '.components[] | "\(.name)@\(.version)"' sbom.json >> dependencies.txt || true
          echo "" >> dependencies.txt
          echo "Total dependencies: $(wc -l < dependencies.txt)" >> dependencies.txt
          cat dependencies.txt

      - name: Upload dependency summary
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-summary
          path: dependencies.txt

  scan-osv:
    needs: inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .

      - name: Run OSV Scanner on SBOM
        uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@1f1242919d8a60496dd1874b24b62b2370ed4c78
        with:
          scan-args: |
            --sbom sbom.json
