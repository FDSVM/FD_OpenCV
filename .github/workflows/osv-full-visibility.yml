# Jonas:  On 03/31/2026 built this to list out the OSV Scanner files and dependencies.

name: OSV Scanner + Full Dependency Audit

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: '43 22 * * 6'

permissions:
  security-events: write
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Job 1: COMPLETE FILE INVENTORY
  # ─────────────────────────────────────────────
  inventory:
    name: "📋 File Inventory & Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - name: "⬇️ Step 1: Download source code from repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ─────────────────────────────────────────
      # SECTION A: ALL FILES IN REPOSITORY
      # ─────────────────────────────────────────
      - name: "📁 Section A: List EVERY file in the repository"
        run: |
          echo "============================================================" > all_files.txt
          echo "  COMPLETE REPOSITORY FILE LIST" >> all_files.txt
          echo "  Repository: ${{ github.repository }}" >> all_files.txt
          echo "  Branch:     ${{ github.ref_name }}" >> all_files.txt
          echo "  Commit:     ${{ github.sha }}" >> all_files.txt
          echo "  Generated:  $(date -u)" >> all_files.txt
          echo "============================================================" >> all_files.txt
          echo "" >> all_files.txt

          echo "────────────────────────────────────────" >> all_files.txt
          echo "  ALL FILES (complete tree)" >> all_files.txt
          echo "────────────────────────────────────────" >> all_files.txt
          find . -not -path './.git/*' -type f | sort >> all_files.txt
          echo "" >> all_files.txt
          TOTAL_ALL=$(find . -not -path './.git/*' -type f | wc -l)
          echo "  TOTAL FILES IN REPOSITORY: $TOTAL_ALL" >> all_files.txt
          echo "" >> all_files.txt

          cat all_files.txt
          echo "" 
          echo "📁 Total files in repository: $TOTAL_ALL"

      - name: "📁 Section A — Upload: Complete file list artifact"
        uses: actions/upload-artifact@v4
        with:
          name: 01-all-repository-files
          path: all_files.txt
          retention-days: 90

      # ─────────────────────────────────────────
      # SECTION B: SOURCE CODE FILES BY TYPE
      # ─────────────────────────────────────────
      - name: "📝 Section B: List SOURCE CODE files organized by type (.c .cpp .h .s)"
        run: |
          echo "============================================================" > source_files.txt
          echo "  SOURCE CODE FILE INVENTORY" >> source_files.txt
          echo "  Repository: ${{ github.repository }}" >> source_files.txt
          echo "  Branch:     ${{ github.ref_name }}" >> source_files.txt
          echo "  Commit:     ${{ github.sha }}" >> source_files.txt
          echo "  Generated:  $(date -u)" >> source_files.txt
          echo "============================================================" >> source_files.txt
          echo "" >> source_files.txt

          # ── C Source Files ──
          echo "────────────────────────────────────────" >> source_files.txt
          echo "  C SOURCE FILES (.c)" >> source_files.txt
          echo "────────────────────────────────────────" >> source_files.txt
          find . -not -path './.git/*' -type f -name "*.c" | sort >> source_files.txt
          C_COUNT=$(find . -not -path './.git/*' -type f -name "*.c" | wc -l)
          echo "  Count: $C_COUNT" >> source_files.txt
          echo "" >> source_files.txt

          # ── C++ Source Files ──
          echo "────────────────────────────────────────" >> source_files.txt
          echo "  C++ SOURCE FILES (.cpp / .cc / .cxx)" >> source_files.txt
          echo "────────────────────────────────────────" >> source_files.txt
          find . -not -path './.git/*' -type f $ -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" $ | sort >> source_files.txt
          CPP_COUNT=$(find . -not -path './.git/*' -type f $ -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" $ | wc -l)
          echo "  Count: $CPP_COUNT" >> source_files.txt
          echo "" >> source_files.txt

          # ── Header Files ──
          echo "────────────────────────────────────────" >> source_files.txt
          echo "  HEADER FILES (.h / .hpp)" >> source_files.txt
          echo "────────────────────────────────────────" >> source_files.txt
          find . -not -path './.git/*' -type f $ -name "*.h" -o -name "*.hpp" $ | sort >> source_files.txt
          H_COUNT=$(find . -not -path './.git/*' -type f $ -name "*.h" -o -name "*.hpp" $ | wc -l)
          echo "  Count: $H_COUNT" >> source_files.txt
          echo "" >> source_files.txt

          # ── Assembly Files ──
          echo "────────────────────────────────────────" >> source_files.txt
          echo "  ASSEMBLY FILES (.s / .S / .asm)" >> source_files.txt
          echo "────────────────────────────────────────" >> source_files.txt
          find . -not -path './.git/*' -type f $ -name "*.s" -o -name "*.S" -o -name "*.asm" $ | sort >> source_files.txt
          ASM_COUNT=$(find . -not -path './.git/*' -type f $ -name "*.s" -o -name "*.S" -o -name "*.asm" $ | wc -l)
          echo "  Count: $ASM_COUNT" >> source_files.txt
          echo "" >> source_files.txt

          # ── Linker Scripts ──
          echo "────────────────────────────────────────" >> source_files.txt
          echo "  LINKER SCRIPTS (.ld / .icf)" >> source_files.txt
          echo "────────────────────────────────────────" >> source_files.txt
          find . -not -path './.git/*' -type f $ -name "*.ld" -o -name "*.icf" $ | sort >> source_files.txt
          LD_COUNT=$(find . -not -path './.git/*' -type f $ -name "*.ld" -o -name "*.icf" $ | wc -l)
          echo "  Count: $LD_COUNT" >> source_files.txt
          echo "" >> source_files.txt

          # ── Build / Config Files ──
          echo "────────────────────────────────────────" >> source_files.txt
          echo "  BUILD & CONFIG FILES" >> source_files.txt
          echo "────────────────────────────────────────" >> source_files.txt
          find . -not -path './.git/*' -type f $ \
            -name "CMakeLists.txt" -o -name "*.cmake" \
            -o -name "Makefile" -o -name "*.mk" \
            -o -name "*.json" -o -name "*.yml" -o -name "*.yaml" \
            -o -name "*.cfg" -o -name "*.conf" -o -name "*.ini" \
            -o -name "*.ld" -o -name "*.icf" \
            -o -name "*.sln" -o -name "*.vcxproj" \
          $ | sort >> source_files.txt
          BUILD_COUNT=$(find . -not -path './.git/*' -type f $ \
            -name "CMakeLists.txt" -o -name "*.cmake" \
            -o -name "Makefile" -o -name "*.mk" \
            -o -name "*.json" -o -name "*.yml" -o -name "*.yaml" \
          $ | wc -l)
          echo "  Count: $BUILD_COUNT" >> source_files.txt
          echo "" >> source_files.txt

          # ── OpenCV Config ──
          echo "────────────────────────────────────────" >> source_files.txt
          echo "  OPENCV CONFIGURATION FILES" >> source_files.txt
          echo "────────────────────────────────────────" >> source_files.txt
          find . -not -path './.git/*' -type f $ \
            -name "OpenCVConfig.cmake" -o -name "opencv2/core.hpp" \
            -o -name "cvconfig.h" -o -name "FreeRTOSConfig.h" \
          $ | sort >> source_files.txt
          echo "" >> source_files.txt

          # ── Summary ──
          TOTAL=$((C_COUNT + CPP_COUNT + H_COUNT + ASM_COUNT))
          echo "============================================================" >> source_files.txt
          echo "  SUMMARY" >> source_files.txt
          echo "============================================================" >> source_files.txt
          echo "  C Source Files:      $C_COUNT" >> source_files.txt
          echo "  C++ Source Files:    $CPP_COUNT" >> source_files.txt
          echo "  Header Files:        $H_COUNT" >> source_files.txt
          echo "  Assembly Files:      $ASM_COUNT" >> source_files.txt
          echo "  Linker Scripts:      $LD_COUNT" >> source_files.txt
          echo "  Build/Config Files:  $BUILD_COUNT" >> source_files.txt
          echo "  ──────────────────────────────" >> source_files.txt
          echo "  TOTAL SOURCE FILES:  $TOTAL" >> source_files.txt
          echo "============================================================" >> source_files.txt

          cat source_files.txt

      - name: "📝 Section B — Upload: Source code inventory artifact"
        uses: actions/upload-artifact@v4
        with:
          name: 02-source-code-files
          path: source_files.txt
          retention-days: 90

      # ─────────────────────────────────────────
      # SECTION C: DEPENDENCY IDENTIFICATION
      # ─────────────────────────────────────────
      - name: "🔗 Section C-1: Find Git Submodules (external repos linked to this project)"
        run: |
          echo "============================================================" > dependencies.txt
          echo "  DEPENDENCY IDENTIFICATION REPORT" >> dependencies.txt
          echo "  Repository: ${{ github.repository }}" >> dependencies.txt
          echo "  Branch:     ${{ github.ref_name }}" >> dependencies.txt
          echo "  Commit:     ${{ github.sha }}" >> dependencies.txt
          echo "  Generated:  $(date -u)" >> dependencies.txt
          echo "============================================================" >> dependencies.txt
          echo "" >> dependencies.txt

          echo "────────────────────────────────────────" >> dependencies.txt
          echo "  1. GIT SUBMODULES" >> dependencies.txt
          echo "     (External repos pulled into this project)" >> dependencies.txt
          echo "────────────────────────────────────────" >> dependencies.txt
          if [ -f ".gitmodules" ]; then
            echo "  .gitmodules found:" >> dependencies.txt
            echo "" >> dependencies.txt
            cat .gitmodules >> dependencies.txt
            echo "" >> dependencies.txt
            echo "  Submodule status:" >> dependencies.txt
            git submodule status >> dependencies.txt 2>/dev/null || echo "  (unable to get status)" >> dependencies.txt
          else
            echo "  No .gitmodules file found" >> dependencies.txt
          fi
          echo "" >> dependencies.txt

          cat dependencies.txt

      - name: "🔗 Section C-2: Detect FreeRTOS / OpenCV components in the repo"
        run: |
          echo "────────────────────────────────────────" >> dependencies.txt
          echo "  2. KNOWN COMPONENTS DETECTED" >> dependencies.txt
          echo "     (Searching for recognized libraries)" >> dependencies.txt
          echo "────────────────────────────────────────" >> dependencies.txt

          # FreeRTOS Kernel
          KERNEL=$(find . -not -path './.git/*' -name "tasks.c" -path "*/FreeRTOS*" -print -quit)
          if [ -n "$KERNEL" ]; then
            echo "  ✅ FreeRTOS Kernel: FOUND" >> dependencies.txt
            VERSION_FILE=$(find . -not -path './.git/*' -name "task.h" -print -quit)
            if [ -n "$VERSION_FILE" ]; then
              echo "     Version info:" >> dependencies.txt
              grep -E "tskKERNEL_VERSION_" "$VERSION_FILE" | head -5 >> dependencies.txt || true
            fi
          else
            echo "  ❌ FreeRTOS Kernel: NOT FOUND" >> dependencies.txt
          fi

          # Known libraries
          KNOWN_LIBS=(
            "coreMQTT:MQTT Client"
            "coreHTTP:HTTP Client"
            "coreJSON:JSON Parser"
            "corePKCS11:PKCS#11 Crypto"
            "coreSNTP:SNTP Client"
            "FreeRTOS-Plus-TCP:TCP/IP Stack"
            "FreeRTOS-Plus-CLI:Command Line Interface"
            "backoffAlgorithm:Retry Algorithm"
            "aws-iot-device-sdk:AWS IoT SDK"
            "mbedtls:TLS/Crypto Library"
            "lwIP:Lightweight IP Stack"
            "tinycbor:CBOR Parser"
            "opencv:Computer Vision Library"
            "zlib:Compression Library"
            "libjpeg:JPEG Image Library"
            "libpng:PNG Image Library"
            "libtiff:TIFF Image Library"
            "protobuf:Protocol Buffers"
            "eigen:Linear Algebra Library"
          )
          for entry in "${KNOWN_LIBS[@]}"; do
            LIB_NAME="${entry%%:*}"
            LIB_DESC="${entry##*:}"
            if find . -not -path './.git/*' -type d -iname "$LIB_NAME" | grep -q .; then
              LIB_PATH=$(find . -not -path './.git/*' -type d -iname "$LIB_NAME" -print -quit)
              echo "  ✅ $LIB_NAME ($LIB_DESC): $LIB_PATH" >> dependencies.txt
            fi
          done
          echo "" >> dependencies.txt

          cat dependencies.txt

      - name: "🔗 Section C-3: Find all #include statements (what libraries your code uses)"
        run: |
          echo "────────────────────────────────────────" >> dependencies.txt
          echo "  3. ALL UNIQUE #include STATEMENTS" >> dependencies.txt
          echo "     (Every library/header your code references)" >> dependencies.txt
          echo "────────────────────────────────────────" >> dependencies.txt
          echo "" >> dependencies.txt

          echo "  --- System/Standard Library Includes <...> ---" >> dependencies.txt
          echo "  (External libraries installed on the system)" >> dependencies.txt
          grep -rh "^#include\s*<" --include="*.c" --include="*.cpp" \
            --include="*.h" --include="*.hpp" . 2>/dev/null | \
            sed 's/^[[:space:]]*//' | sort -u >> dependencies.txt || true
          SYS_COUNT=$(grep -rh "^#include\s*<" --include="*.c" --include="*.cpp" \
            --include="*.h" --include="*.hpp" . 2>/dev/null | sort -u | wc -l)
          echo "  Count: $SYS_COUNT unique system includes" >> dependencies.txt
          echo "" >> dependencies.txt

          echo '  --- Project/Local Includes "..." ---' >> dependencies.txt
          echo "  (Files within this project)" >> dependencies.txt
          grep -rh '^#include\s*"' --include="*.c" --include="*.cpp" \
            --include="*.h" --include="*.hpp" . 2>/dev/null | \
            sed 's/^[[:space:]]*//' | sort -u >> dependencies.txt || true
          LOCAL_COUNT=$(grep -rh '^#include\s*"' --include="*.c" --include="*.cpp" \
            --include="*.h" --include="*.hpp" . 2>/dev/null | sort -u | wc -l)
          echo "  Count: $LOCAL_COUNT unique local includes" >> dependencies.txt
          echo "" >> dependencies.txt

      - name: "🔗 Section C-4: Map each #include to its source file (who depends on what)"
        run: |
          echo "────────────────────────────────────────" >> dependencies.txt
          echo "  4. INCLUDE STATEMENTS WITH SOURCE FILE" >> dependencies.txt
          echo "     (Shows: file.c:line:#include <library>)" >> dependencies.txt
          echo "────────────────────────────────────────" >> dependencies.txt
          grep -rn "^#include" --include="*.c" --include="*.cpp" \
            --include="*.h" --include="*.hpp" . 2>/dev/null | \
            sort >> dependencies.txt || true
          echo "" >> dependencies.txt

      - name: "🔗 Section C-5: Find CMake build dependencies (find_package, FetchContent, etc.)"
        run: |
          echo "────────────────────────────────────────" >> dependencies.txt
          echo "  5. CMAKE DEPENDENCIES" >> dependencies.txt
          echo "     (External libraries pulled in by the build system)" >> dependencies.txt
          echo "────────────────────────────────────────" >> dependencies.txt
          echo "" >> dependencies.txt

          echo "  find_package() — Libraries CMake searches for:" >> dependencies.txt
          grep -rn "find_package" --include="CMakeLists.txt" --include="*.cmake" . 2>/dev/null | \
            sort >> dependencies.txt || echo "  (none found)" >> dependencies.txt
          echo "" >> dependencies.txt

          echo "  FetchContent_Declare() — Libraries downloaded during build:" >> dependencies.txt
          grep -rn "FetchContent_Declare" --include="CMakeLists.txt" --include="*.cmake" . 2>/dev/null | \
            sort >> dependencies.txt || echo "  (none found)" >> dependencies.txt
          echo "" >> dependencies.txt

          echo "  ExternalProject_Add() — External projects built alongside:" >> dependencies.txt
          grep -rn "ExternalProject_Add" --include="CMakeLists.txt" --include="*.cmake" . 2>/dev/null | \
            sort >> dependencies.txt || echo "  (none found)" >> dependencies.txt
          echo "" >> dependencies.txt

          echo "  add_subdirectory() — Subdirectories included in the build:" >> dependencies.txt
          grep -rn "add_subdirectory" --include="CMakeLists.txt" --include="*.cmake" . 2>/dev/null | \
            sort >> dependencies.txt || echo "  (none found)" >> dependencies.txt
          echo "" >> dependencies.txt

          echo "  target_link_libraries() — Libraries linked to executables:" >> dependencies.txt
          grep -rn "target_link_libraries" --include="CMakeLists.txt" --include="*.cmake" . 2>/dev/null | \
            sort >> dependencies.txt || echo "  (none found)" >> dependencies.txt
          echo "" >> dependencies.txt

      - name: "🔗 Section C-6: Check for package manager files (vcpkg, conan, pip, etc.)"
        run: |
          echo "────────────────────────────────────────" >> dependencies.txt
          echo "  6. PACKAGE MANAGER FILES" >> dependencies.txt
          echo "     (Files that list installable dependencies)" >> dependencies.txt
          echo "────────────────────────────────────────" >> dependencies.txt
          MANIFESTS=("vcpkg.json" "conanfile.txt" "conanfile.py" \
                     "manifest.yml" "sbom.json" "package.json" \
                     "requirements.txt" "Pipfile" "Cargo.toml")
          for manifest in "${MANIFESTS[@]}"; do
            FOUND=$(find . -not -path './.git/*' -name "$manifest" -type f 2>/dev/null)
            if [ -n "$FOUND" ]; then
              echo "  ✅ $manifest:" >> dependencies.txt
              echo "$FOUND" | while read -r f; do
                echo "     $f" >> dependencies.txt
                echo "     Contents:" >> dependencies.txt
                cat "$f" | sed 's/^/       /' >> dependencies.txt
                echo "" >> dependencies.txt
              done
            else
              echo "  ❌ $manifest: not found" >> dependencies.txt
            fi
          done
          echo "" >> dependencies.txt

      - name: "🔗 Section C-7: Find hardware/BSP/SDK folders (board support packages)"
        run: |
          echo "────────────────────────────────────────" >> dependencies.txt
          echo "  7. HARDWARE / BSP / SDK COMPONENTS" >> dependencies.txt
          echo "     (Board support packages and hardware drivers)" >> dependencies.txt
          echo "────────────────────────────────────────" >> dependencies.txt
          HW_DIRS=("BSP" "HAL" "CMSIS" "Drivers" "SDK" "board" "platform")
          for dir in "${HW_DIRS[@]}"; do
            FOUND=$(find . -not -path './.git/*' -type d -iname "$dir" 2>/dev/null)
            if [ -n "$FOUND" ]; then
              echo "  ✅ $dir:" >> dependencies.txt
              echo "$FOUND" | sed 's/^/     /' >> dependencies.txt
            fi
          done
          echo "" >> dependencies.txt

      - name: "🔗 Section C-8: Find vendor/third-party folders (external code bundled in repo)"
        run: |
          echo "────────────────────────────────────────" >> dependencies.txt
          echo "  8. VENDOR / THIRD-PARTY DIRECTORIES" >> dependencies.txt
          echo "     (External code bundled inside this repository)" >> dependencies.txt
          echo "────────────────────────────────────────" >> dependencies.txt
          VENDOR_DIRS=("vendor" "third_party" "third-party" "thirdparty" \
                       "external" "extern" "deps" "lib" "libs" "3rdparty")
          for dir in "${VENDOR_DIRS[@]}"; do
            FOUND=$(find . -not -path './.git/*' -maxdepth 2 -type d -iname "$dir" 2>/dev/null)
            if [ -n "$FOUND" ]; then
              echo "  ✅ $dir:" >> dependencies.txt
              echo "$FOUND" | sed 's/^/     /' >> dependencies.txt
              echo "     Contents:" >> dependencies.txt
              for d in $FOUND; do
                ls -1 "$d" 2>/dev/null | sed 's/^/       /' >> dependencies.txt
              done
            fi
          done
          echo "" >> dependencies.txt

          # ── SUMMARY ──
          SYS_COUNT=$(grep -rh "^#include\s*<" --include="*.c" --include="*.cpp" \
            --include="*.h" --include="*.hpp" . 2>/dev/null | sort -u | wc -l)
          LOCAL_COUNT=$(grep -rh '^#include\s*"' --include="*.c" --include="*.cpp" \
            --include="*.h" --include="*.hpp" . 2>/dev/null | sort -u | wc -l)
          echo "============================================================" >> dependencies.txt
          echo "  DEPENDENCY SUMMARY" >> dependencies.txt
          echo "============================================================" >> dependencies.txt
          echo "  Unique system includes:  $SYS_COUNT" >> dependencies.txt
          echo "  Unique local includes:   $LOCAL_COUNT" >> dependencies.txt
          SUBMOD_COUNT=$(git submodule status 2>/dev/null | wc -l || echo 0)
          echo "  Git submodules:          $SUBMOD_COUNT" >> dependencies.txt
          echo "============================================================" >> dependencies.txt

          cat dependencies.txt

      - name: "🔗 Section C — Upload: Dependency report artifact"
        uses: actions/upload-artifact@v4
        with:
          name: 03-dependency-report
          path: dependencies.txt
          retention-days: 90

      # ─────────────────────────────────────────
      # SECTION D: COMBINED SUMMARY REPORT
      # ─────────────────────────────────────────
      - name: "📊 Section D: Generate one-page summary dashboard"
        run: |
          echo "============================================================" > summary_report.txt
          echo "  SECURITY AUDIT SUMMARY REPORT" >> summary_report.txt
          echo "  Repository: ${{ github.repository }}" >> summary_report.txt
          echo "  Branch:     ${{ github.ref_name }}" >> summary_report.txt
          echo "  Commit:     ${{ github.sha }}" >> summary_report.txt
          echo "  Generated:  $(date -u)" >> summary_report.txt
          echo "  Run ID:     ${{ github.run_id }}" >> summary_report.txt
          echo "============================================================" >> summary_report.txt
          echo "" >> summary_report.txt

          echo "  REPOSITORY STATISTICS" >> summary_report.txt
          echo "  ─────────────────────" >> summary_report.txt
          echo "  Total files:         $(find . -not -path './.git/*' -type f | wc -l)" >> summary_report.txt
          echo "  Total directories:   $(find . -not -path './.git/*' -type d | wc -l)" >> summary_report.txt
          echo "  C files (.c):        $(find . -not -path './.git/*' -type f -name '*.c' | wc -l)" >> summary_report.txt
          echo "  C++ files:           $(find . -not -path './.git/*' -type f $ -name '*.cpp' -o -name '*.cc' $ | wc -l)" >> summary_report.txt
          echo "  Headers (.h/.hpp):   $(find . -not -path './.git/*' -type f $ -name '*.h' -o -name '*.hpp' $ | wc -l)" >> summary_report.txt
          echo "  Assembly files:      $(find . -not -path './.git/*' -type f $ -name '*.s' -o -name '*.S' -o -name '*.asm' $ | wc -l)" >> summary_report.txt
          echo "  CMake files:         $(find . -not -path './.git/*' -type f $ -name 'CMakeLists.txt' -o -name '*.cmake' $ | wc -l)" >> summary_report.txt
          echo "  Makefiles:           $(find . -not -path './.git/*' -type f $ -name 'Makefile' -o -name '*.mk' $ | wc -l)" >> summary_report.txt
          echo "  Git submodules:      $(git submodule status 2>/dev/null | wc -l || echo 0)" >> summary_report.txt
          echo "" >> summary_report.txt

          echo "  ARTIFACTS GENERATED" >> summary_report.txt
          echo "  ─────────────────────" >> summary_report.txt
          echo "  01-all-repository-files   — Every file in the repo" >> summary_report.txt
          echo "  02-source-code-files      — Source code organized by type" >> summary_report.txt
          echo "  03-dependency-report      — All dependencies identified" >> summary_report.txt
          echo "  04-summary-report         — This summary" >> summary_report.txt
          echo "============================================================" >> summary_report.txt

          cat summary_report.txt

      - name: "📊 Section D — Upload: Summary report artifact"
        uses: actions/upload-artifact@v4
        with:
          name: 04-summary-report
          path: summary_report.txt
          retention-days: 90

  # ─────────────────────────────────────────────
  # Job 2: OSV Vulnerability Scan
  # ─────────────────────────────────────────────
  scan-osv:
    name: "🛡️ OSV Vulnerability Scanner"
    needs: inventory
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@1f1242919d8a60496dd1874b24b62b2370ed4c78
    with:
      scan-args: |
        -r
        --skip-git
        ./
